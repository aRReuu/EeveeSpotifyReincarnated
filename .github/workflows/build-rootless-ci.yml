name: Build EeveeSpotify rootless DEB (IPA prerequisite)

on:
  push:
    branches: [Master]
    paths:
      - .github/workflows/build-rootless-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rootless-deb:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      SWIFTPROTOBUF_VERSION: "1.29.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build SwiftProtobuf framework
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build rootless package
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
